events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;

  # nginx's stock error pages print "nginx/<version>" in the body, which ZAP
  # reports as an In Page Banner Information Leak (10009). This drops the
  # version everywhere; the custom 404 below removes the product name too.
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/x-javascript
    application/xml
    application/json
    application/ld+json
    image/svg+xml;

  server {
    listen 80;

    include /etc/nginx/security-headers.conf;

    # Single static page, no client-side router: serve what exists and let
    # anything else 404. An SPA fallback here would answer every bogus path
    # with index.html and HTTP 200, which is what made ZAP report findings
    # against /sitemap.xml — a file this site does not have.
    location / {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # internal: reachable only via error_page, so /404.html itself still 404s
    # rather than becoming a real 200 page that ZAP would scan as content.
    location = /404.html {
      root /usr/share/nginx/html;
      internal;
    }

    location ~* \.(js|css)$ {
      root /usr/share/nginx/html;
      expires 1y;
      add_header Cache-Control "public, immutable";
      include /etc/nginx/security-headers.conf;
      access_log off;
    }

    location ~* \.(?:woff2?|svg|ico|png|jpg|jpeg|gif|webp)$ {
      root /usr/share/nginx/html;
      expires 7d;
      add_header Cache-Control "public";
      include /etc/nginx/security-headers.conf;
      access_log off;
    }
  }
}
