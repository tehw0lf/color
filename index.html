<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Color – instantly preview and convert any color format (HEX, RGB, CMYK) in your browser." />
    <title>color</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%238e8e8e'/></svg>" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        width: 100vw;
        height: 100vh;
        background: #8e8e8e;
        transition: background 0.3s;
      }

      #overlay {
        position: fixed;
        bottom: 1rem;
        right: 1rem;
        padding: 0.5rem 0.75rem;
        border-radius: 6px;
        font-family: 'Inter', Arial, sans-serif;
        font-size: 0.75rem;
        line-height: 1.6;
        background: rgba(0, 0, 0, 0.15);
        backdrop-filter: blur(4px);
        color: #fff;
        user-select: all;
      }

      #overlay.dark-text {
        background: rgba(255, 255, 255, 0.25);
        color: #000;
      }

      #overlay div { white-space: nowrap; }
    </style>
  </head>
  <body>
    <main>
    <div id="overlay">
      <div id="val-hex">—</div>
      <div id="val-rgb">—</div>
      <div id="val-cmyk">—</div>
    </div>
    <script>
      function cmykToRgb(c, m, y, k) {
        const r = Math.round(255 * (1 - c / 100) * (1 - k / 100));
        const g = Math.round(255 * (1 - m / 100) * (1 - k / 100));
        const b = Math.round(255 * (1 - y / 100) * (1 - k / 100));
        return { r, g, b };
      }

      function rgbToHex(r, g, b) {
        return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
      }

      // One decimal is enough to survive the round trip back to the same
      // 8-bit channel; integers lose up to 2 per channel. Trailing .0 is
      // dropped so whole percentages stay readable.
      function pct(v) {
        return Number((v * 100).toFixed(1));
      }

      function rgbToCmyk(r, g, b) {
        const rn = r / 255, gn = g / 255, bn = b / 255;
        const k = 1 - Math.max(rn, gn, bn);
        if (k === 1) return { c: 0, m: 0, y: 0, k: 100 };
        const c = (1 - rn - k) / (1 - k);
        const m = (1 - gn - k) / (1 - k);
        const y = (1 - bn - k) / (1 - k);
        return {
          c: pct(c),
          m: pct(m),
          y: pct(y),
          k: pct(k)
        };
      }

      function luminance(r, g, b) {
        return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      }

      function resolveColorToRgb(raw) {
        // CMYK is not a CSS colour type, so we parse it ourselves. Print
        // workflows quote percentages with decimals, so accept them.
        const NUM = String.raw`\d+(?:\.\d+)?`;
        const cmykRe = new RegExp(
          `^cmyk\\(\\s*(${NUM})\\s*,\\s*(${NUM})\\s*,\\s*(${NUM})\\s*,\\s*(${NUM})\\s*\\)$`, 'i');
        const cmykMatch = raw.match(cmykRe);
        if (cmykMatch) {
          const [, c, m, y, k] = cmykMatch.map(Number);
          return { rgb: cmykToRgb(c, m, y, k), sourceCmyk: { c, m, y, k } };
        }

        // Try as a CSS colour via canvas. A bare hex like "8e8e8e" is not a
        // CSS colour, so retry it with a leading # — that is the form the
        // README documents and the one a colour picker hands you.
        const rgb = parseCssColor(raw) ?? (/^[0-9a-f]{3,8}$/i.test(raw) ? parseCssColor('#' + raw) : null);
        if (!rgb) return null;
        return { rgb, sourceCmyk: null };
      }

      function parseCssColor(value) {
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = 1;
        const ctx = canvas.getContext('2d');
        // Assigning an invalid colour leaves fillStyle untouched, so probe
        // twice using two different starting points: only an unparsed value keeps
        // both. A single sentinel would misread that exact colour as invalid.
        ctx.fillStyle = '#010203';
        ctx.fillStyle = value;
        const first = ctx.fillStyle;
        ctx.fillStyle = '#040506';
        ctx.fillStyle = value;
        if (first === '#010203' && ctx.fillStyle === '#040506') return null;
        ctx.fillRect(0, 0, 1, 1);
        const [r, g, b] = ctx.getImageData(0, 0, 1, 1).data;
        return { r, g, b };
      }

      function applyColor(raw) {
        if (!raw) {
          applyRgb({ r: 142, g: 142, b: 142 }, null);
          return;
        }

        const result = resolveColorToRgb(raw);
        if (!result) {
          applyRgb({ r: 142, g: 142, b: 142 }, null);
          return;
        }
        applyRgb(result.rgb, result.sourceCmyk);
      }

      function applyRgb({ r, g, b }, sourceCmyk) {
        const hex = rgbToHex(r, g, b);
        document.body.style.background = hex;

        const cmyk = sourceCmyk ?? rgbToCmyk(r, g, b);
        document.getElementById('val-hex').textContent = `HEX  ${hex}`;
        document.getElementById('val-rgb').textContent = `RGB  ${r}, ${g}, ${b}`;
        document.getElementById('val-cmyk').textContent =
          `CMYK ${cmyk.c}, ${cmyk.m}, ${cmyk.y}, ${cmyk.k}`;

        const overlay = document.getElementById('overlay');
        overlay.classList.toggle('dark-text', luminance(r, g, b) > 0.5);
      }

      // ── INIT ────────────────────────────────────────────────────────────────
      window.addEventListener('load', () => {
        const param = window.location.search.slice(1);
        applyColor(decodeURIComponent(param));
      });

      // ── postMessage theme sync ───────────────────────────────────────────────
      window.addEventListener('message', (e) => {
        if (e.data?.type === 'color') {
          applyColor(decodeURIComponent(e.data.color));
        }
      });
    </script>
    </main>
  </body>
</html>
